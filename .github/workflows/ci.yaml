name: DevSecOps CI
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps: 
    - name: Checkout Repository
      uses: actions/checkout@v4
    
    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    
    - name: Restore Dependencies
      run: dotnet restore ./PadelWeather.Api.csproj
    
    - name: Build
      run: dotnet build --no-restore ./PadelWeather.Api.csproj --configuration Release 
