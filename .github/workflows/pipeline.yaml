name: DevSecOps CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  ci:
    uses: ./.github/workflows/ci.yaml
  
  security-scan:
    needs: ci
    uses: ./.github/workflows/security-scan.yaml
  
  docker-and-scan:
    needs: security-scan
    uses: ./.github/workflows/docker-and-scan.yaml
  